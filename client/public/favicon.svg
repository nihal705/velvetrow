<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#f84565" stroke-width="2"/>
  
  <!-- Gradient Background (matches bg-gradient-to-br from-primary/20 to-transparent) -->
  <defs>
    <radialGradient id="gradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#f84565;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#f84565;stop-opacity:0" />
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="45" fill="url(#gradient)"/>
  
  <!-- Shadow effect (matches shadow-lg shadow-primary/20) -->
  <filter id="shadow">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f84565" flood-opacity="0.2"/>
  </filter>
  
  <!-- "V" Letter -->
  <text 
    x="50" 
    y="68" 
    font-family="'Playfair Display', Georgia, serif" 
    font-size="52" 
    font-weight="700" 
    text-anchor="middle" 
    fill="#f84565"
    filter="url(#shadow)"
  >
    V
  </text>
</svg>